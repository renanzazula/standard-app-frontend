<div class="card">
  <div class="card-header">
    <h3 class="card-title">Search {{page_nome}}</h3>
  </div>
  <div class="card-body">
    <div class="table-responsive-sm">
      <table class="table table-bordered table-hover">
        <thead class="thead-dark">
        <tr>
          <th scope="col">Id</th>
          <th scope="col">Name</th>
          <th scope="col">Description</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngIf="domains.length ===0" scope="row">
          <td class="col text-center" colspan="4">{{nunhum_encontrado}}</td>
        </tr>
        <tr *ngFor="let domain of domains" scope="row" [routerLink]="['/domain', domain.id, 'edit']">
          <td>{{domain.id}}</td>
          <td>{{domain.name}}</td>
          <td>{{domain.description}}</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
