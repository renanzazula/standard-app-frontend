<div class="card">
    <div class="card-header">
        <h3 class="card-title">Search Measure</h3>
    </div>
    <div class="card-body">
        <div class="table-responsive-sm">
            <table class="table table-bordered">
                <thead class="thead-dark">
                    <tr>
                        <th scope="col">Valor</th>
                    </tr>
                </thead>
                <tbody *ngIf="measures.length === 0">
                    <tr>
                        <td class="col text-center"  >No Measure found!</td>
                    </tr>
                </tbody>
                <tbody>
                    <tr *ngFor="let measure of measures" scope="row">
                        <td>
                            <table class="table">
                                <tbody>
                                    <tr *ngFor="let itemsTypeMeasure of measure.itemsTypeMeasure; let i = index" [attr.data-index]="i"  >
                                        <td *ngIf="i === 0" scope="col" style="background-color: lightgrey; font-weight: bold" [routerLink]="['/measure', measure.id, 'edit']" >
                                            {{measure.id}} - {{measure.name}} - {{itemsTypeMeasure.category.name}} - {{measure.description}}
                                        </td>
                                    </tr>
                                    <tr *ngFor="let itemsTypeMeasure of measure.itemsTypeMeasure; let i = index" [attr.data-index]="i"  >
                                        <td scope="col">
                                            {{itemsTypeMeasure.amount}}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
