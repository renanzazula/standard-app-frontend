<div class="card">
    <div class="card-header">
        <h3 class="card-title">Search Brand</h3>
    </div>
    <div class="card-body">
        <div class="table-responsive-sm">
            <table class="table table-bordered table-hover">
                <thead class="thead-dark">
                <tr>
                    <th scope="col">Id</th>
                    <th scope="col">Name</th>
                    <th scope="col">Description</th>
                    <th scope="col">Status</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngIf="brands.length ===0" scope="row">
                    <td class="col text-center" colspan="4">No Brand found!</td>
                </tr>
                <tr *ngFor="let brand of brands" scope="row" [routerLink]="['/brand', brand.id, 'edit']">
                    <td>{{brand.id}}</td>
                    <td>{{brand.name}}</td>
                    <td>{{brand.description}}</td>
                    <td>{{brand.status}}</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
